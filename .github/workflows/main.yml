name: Next js workflow build

on:
  push: 
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6.1.0

      - name: Setup node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build next js app
        run: npm run build

      - name: Upoload build on artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nextjs-build
          path: out/
